<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <link rel="shortcut icon" type="image/png" href="img/favicon.png" />
        <title>Together — Quang Tèo & Ngọc Ruby</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Outfit:wght@300;400;500&family=Great+Vibes&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css?v=5" />
    </head>
    <body>
        <div class="petals" aria-hidden="true">
            <span class="petal">♡</span>
            <span class="petal">♥</span>
            <span class="petal">♡</span>
            <span class="petal">♥</span>
            <span class="petal">♡</span>
            <span class="petal">♥</span>
            <span class="petal">♡</span>
            <span class="petal">♥</span>
            <span class="petal">♡</span>
            <span class="petal">♥</span>
            <span class="petal">♡</span>
            <span class="petal">♥</span>
        </div>

        <main class="stage">
            <p class="brand">Together</p>
            <h1 class="headline">Mỗi ngày bên nhau đều là món quà</h1>
            <p class="support">Đếm từng giây yêu thương của chúng mình</p>

            <section class="couple" aria-label="Cặp đôi">
                <figure class="person">
                    <div class="frame">
                        <img
                            src="./img/IMG_1040.jpeg"
                            alt="Quang Tèo"
                            class="avt"
                        />
                    </div>
                    <figcaption class="name">Quang Tèo</figcaption>
                </figure>

                <div class="bond" aria-hidden="true">
                    <span class="heart-pulse">♥</span>
                    <anni class="since">20-05-2023</anni>
                </div>

                <figure class="person">
                    <div class="frame">
                        <img
                            src="./img/emiu.WEBP"
                            alt="Ngọc Ruby"
                            class="avt"
                        />
                    </div>
                    <figcaption class="name">Ngọc Ruby</figcaption>
                </figure>
            </section>

            <section class="counter" aria-live="polite">
                <div class="counter-card">
                    <date class="days">0 DAYS</date>
                    <time class="clock">00:00:00</time>
                </div>
                <p class="counter-label">ngày đã yêu</p>
            </section>

        </main>

        <button
            type="button"
            class="music-btn"
            id="musicToggle"
            aria-label="Bật / tắt nhạc"
        >
            <span class="music-icon" aria-hidden="true">♪</span>
        </button>
        <audio id="bgMusic" loop preload="auto"></audio>
        <script src="app.js"></script>
    </body>
</html>
